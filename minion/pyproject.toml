[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veilleur-minion"
version = "0.0.0"
description = "Le Veilleur Minion — one-shot Cloud Run Job that publishes the daily tech-watch article."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Aurélien Allienne", email = "allienne.a@sfeir.com" }]
dependencies = [
    "click>=8.1",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-cloud-secret-manager>=2.20",
    "google-genai>=0.3",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-json-logger>=2.0",
    "python-ulid>=2.0",
    # In-container HTML→Markdown main-content extraction — no external scraping service.
    "trafilatura>=2.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The gated real-`claude` tests are deselected by default so CI stays hermetic; run them
# explicitly with `uv run pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: exercises the real `claude` CLI / plugin (needs the binary + OAuth token; off by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "T20", # flake8-print (constitution §4: no print outside structured-log boundary)
]
ignore = []

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["**/__pycache__", "**/.venv"]
reportMissingTypeStubs = false  # google SDKs ship incomplete stubs
