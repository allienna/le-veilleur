name: Deploy site to GitHub Pages

# The Minion commits into site/** through the Contents API, so its daily commit trips this
# workflow — the commit is the publication and this is what makes it visible.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The Minion publishes through the Contents API, which is one commit per file: the image, the
# article, the LinkedIn draft, then one per fiche — around nine pushes in a couple of minutes.
# Superseding the queued runs means one deploy instead of nine, and the last one carries the
# final tree. Cancelling before `deploy-pages` runs leaves the previous deployment live, so
# there is no window where the site is half-published.
#
# The alternative is one atomic commit via the Git Data API (blobs -> tree -> commit -> ref),
# about forty lines in publish/github.py. Not worth it while this one line does the job: the
# commit order already guarantees the article never goes live before its image.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # This is the real content gate: zod validates every article and fiche frontmatter,
      # getStaticPaths proves there are no slug collisions, and the tag pages prove every
      # theme label resolves. A malformed frontmatter fails here, not silently in production.
      - name: Build
        working-directory: site
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
